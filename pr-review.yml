name: Inno - PR Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  inno-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch Inno tool scripts
        run: |
          git clone --depth 1 --branch main \
            "https://github.com/SkySaksham/inno.git" \
            "${RUNNER_TEMP}/inno-tool"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linters
        run: pip install pylint bandit

      # Metadata lives on its own branch.
      - name: Fetch metadata
        env:
          META_BRANCH: inno-metadata
        run: |
          if git fetch --depth 1 origin "${META_BRANCH}" 2>/dev/null; then
            git checkout FETCH_HEAD -- metadata/ 2>/dev/null \
              && echo "Metadata loaded." \
              || echo "No metadata/ directory on branch; continuing without it."
          else
            echo "No metadata branch found; continuing with ast-only context."
          fi

      # -----------------------------------------------------------------------
      # SCAN 1 — Static linters: Pylint + Bandit
      # -----------------------------------------------------------------------
      - name: Scan changed lines (Pylint + Bandit)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          python "${RUNNER_TEMP}/inno-tool/scan.py" \
            --base "origin/${BASE_REF}" --head HEAD \
            --out "${RUNNER_TEMP}/findings.json"

      - name: Build LLM context (linter payloads)
        run: |
          python "${RUNNER_TEMP}/inno-tool/context.py" \
            --findings  "${RUNNER_TEMP}/findings.json" \
            --metadata  "metadata" \
            --out       "${RUNNER_TEMP}/payloads.json"

      # -----------------------------------------------------------------------
      # COPILOT
      # -----------------------------------------------------------------------
      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      # IMPORTANT:
      # Use the fine-grained PAT stored as COPILOT_TOKEN.
      # Do NOT use github.token for Copilot authentication.
      - name: Copilot authentication smoke test
        if: ${{ (vars.INNO_LLM_BACKEND || 'cmd') == 'cmd' }}
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_TOKEN }}
        run: |
          echo "Verifying Copilot CLI authentication..."
          copilot -p "Respond with OK" --silent || {
            echo "::error::GitHub Copilot CLI authentication failed."
            exit 1
          }

      # -----------------------------------------------------------------------
      # AI REVIEW — Linter findings
      # -----------------------------------------------------------------------
      - name: AI review (linter findings)
        env:
          INNO_LLM_BACKEND:     ${{ vars.INNO_LLM_BACKEND || 'cmd' }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_TOKEN }}
          OPENAI_API_KEY:       ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
          INNO_LLM_CMD:         "copilot -p"
        run: |
          python "${RUNNER_TEMP}/inno-tool/ai_review.py" \
            --payloads "${RUNNER_TEMP}/payloads.json" \
            --workers  6 \
            --out      "${RUNNER_TEMP}/review.json"

      # -----------------------------------------------------------------------
      # SCAN 2 — Semantic diff review
      # -----------------------------------------------------------------------
      - name: Build semantic context (diff + call-graph payloads)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          python "${RUNNER_TEMP}/inno-tool/semantic_context.py" \
            --repo     "." \
            --base     "origin/${BASE_REF}" \
            --head     HEAD \
            --metadata "metadata" \
            --out      "${RUNNER_TEMP}/semantic_payloads.json"

      - name: Semantic AI review (diff-driven findings)
        env:
          INNO_LLM_BACKEND:     ${{ vars.INNO_LLM_BACKEND || 'cmd' }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_TOKEN }}
          OPENAI_API_KEY:       ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
          INNO_LLM_CMD:         "copilot -p"
        run: |
          python "${RUNNER_TEMP}/inno-tool/semantic_review.py" \
            --payloads "${RUNNER_TEMP}/semantic_payloads.json" \
            --workers  6 \
            --out      "${RUNNER_TEMP}/semantic_findings.json"

      # -----------------------------------------------------------------------
      # MERGE + REPORT
      # -----------------------------------------------------------------------
      - name: Merge findings
        run: |
          python "${RUNNER_TEMP}/inno-tool/merge.py" \
            --review   "${RUNNER_TEMP}/review.json" \
            --semantic "${RUNNER_TEMP}/semantic_findings.json" \
            --max      15 \
            --out      "${RUNNER_TEMP}/combined_review.json"

      # Posts the PR comment and FAILS the job if blocking findings remain.
      - name: Report and gate
        env:
          # This is intentionally GITHUB_TOKEN, NOT the Copilot PAT.
          # report.py uses it to post/update the PR comment.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python "${RUNNER_TEMP}/inno-tool/report.py" \
            --review  "${RUNNER_TEMP}/combined_review.json" \
            --fail-on high

      # -----------------------------------------------------------------------
      # ARTIFACTS
      # -----------------------------------------------------------------------
      - name: Upload artifacts (for metrics)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inno-results
          path: |
            ${{ runner.temp }}/findings.json
            ${{ runner.temp }}/payloads.json
            ${{ runner.temp }}/review.json
            ${{ runner.temp }}/semantic_payloads.json
            ${{ runner.temp }}/semantic_findings.json
            ${{ runner.temp }}/combined_review.json